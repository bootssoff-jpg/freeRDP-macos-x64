name: build-macos-x86_64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Intel runner; deployment target remains macOS 12.0.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake

      - name: Show and fingerprint toolchain
        id: toolchain
        run: |
          uname -m
          sw_vers
          swift --version
          cmake --version
          fingerprint="$( { xcrun clang --version; xcrun --show-sdk-version; cmake --version; } | shasum -a 256 | awk '{print $1}')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore OpenSSL cache
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/openssl-install
          key: openssl-3.6.4-macos12-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/build_openssl.sh') }}

      - name: Restore FreeRDP cache
        id: freerdp-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/FreeRDP-3.32.2
            vendor/freerdp-install
            vendor/freerdp-*.tar.gz
          key: freerdp-3.32.2-macos12-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('scripts/build_freerdp.sh', 'scripts/fetch_freerdp.sh', 'scripts/build_openssl.sh') }}

      - name: Fetch checksum-verified FreeRDP sources
        run: ./scripts/fetch_freerdp.sh

      - name: Test dependency download failure handling
        run: ./Tests/fetch_freerdp.sh

      - name: Build OpenSSL 3.6.4
        run: ./scripts/build_openssl.sh

      # Save immediately: a later network or test failure must not discard
      # the completed OpenSSL build and force another full compilation.
      - name: Save OpenSSL cache
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: vendor/openssl-install
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}

      - name: Build FreeRDP 3.32.2
        run: ./scripts/build_freerdp.sh

      - name: Save FreeRDP cache
        if: steps.freerdp-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/FreeRDP-3.32.2
            vendor/freerdp-install
            vendor/freerdp-*.tar.gz
          key: ${{ steps.freerdp-cache.outputs.cache-primary-key }}

      - name: Run automated tests
        run: ./scripts/run_tests.sh

      - name: Package unsigned release
        id: package
        run: |
          make dist
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'build/RDP Mac.app/Contents/Info.plist')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify architecture, minimum macOS, rpaths and signature
        run: |
          lipo -info "build/RDP Mac.app/Contents/MacOS/RDPMac" | grep x86_64
          otool -L "build/RDP Mac.app/Contents/MacOS/RDPMac" | grep -E '@rpath/libssl|@rpath/libcrypto'
          ! otool -L "build/RDP Mac.app/Contents/MacOS/RDPMac" | grep -E '/usr/local|/opt/homebrew'
          for f in "build/RDP Mac.app/Contents/MacOS/RDPMac" build/"RDP Mac.app"/Contents/Frameworks/*.dylib; do
            minos="$(otool -l "$f" | awk '/LC_BUILD_VERSION/{x=1} x&&/minos/{print $2; exit}')"
            [ "$(printf '%s\n' 12.0 "$minos" | sort -V | head -1)" = "12.0" ]
          done
          codesign --verify --deep --strict "build/RDP Mac.app"
          (cd build/dist && shasum -a 256 -c SHA256SUMS)

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RDP-Mac-${{ steps.package.outputs.version }}-x86_64-unsigned
          path: |
            build/dist/RDP-Mac-${{ steps.package.outputs.version }}-x86_64-unsigned.zip
            build/dist/RDP-Mac-${{ steps.package.outputs.version }}-x86_64-unsigned.dmg
            build/dist/SHA256SUMS
          if-no-files-found: error
