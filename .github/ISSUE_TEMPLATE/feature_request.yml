name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project deliberately supports a small text-clipboard-focused RDP
        client. Features that add excluded channels (audio, rdpdr, smartcards,
        RAIL) may be out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not require logging passwords or clipboard contents.
          required: true
        - label: This does not enable automatic certificate acceptance.
          required: true
